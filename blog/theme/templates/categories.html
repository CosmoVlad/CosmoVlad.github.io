{% extends "base.html" %}
{% block title %}Categories &ndash; {{ SITENAME }}{% endblock %}
{% block content %}
<section class="listing">
        <header class="listing-header">
                <h1>Categories</h1>
        </header>
        <ul class="entry-list">
        {% for category, cat_articles in categories %}
                <li class="entry">
                        <h2 class="entry-title"><a href="{{ SITEURL }}/{{ category.url }}">{{ category }}</a></h2>
                        <p class="entry-meta">{{ cat_articles|count }} post{{ 's' if cat_articles|count != 1 }}</p>
                </li>
        {% endfor %}
        </ul>
</section>
{% endblock %}
