{% extends "base.html" %}
{% block title %}Authors &ndash; {{ SITENAME }}{% endblock %}
{% block content %}
<section class="listing">
        <header class="listing-header">
                <h1>Authors</h1>
        </header>
        <ul class="entry-list">
        {% for author, author_articles in authors %}
                <li class="entry">
                        <h2 class="entry-title"><a href="{{ SITEURL }}/{{ author.url }}">{{ author }}</a></h2>
                        <p class="entry-meta">{{ author_articles|count }} post{{ 's' if author_articles|count != 1 }}</p>
                </li>
        {% endfor %}
        </ul>
</section>
{% endblock %}
